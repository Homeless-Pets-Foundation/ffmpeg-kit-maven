name: Build FFmpeg Kit min (iOS xcframework)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must match Android for feature parity, e.g. 6.0-3)'
        required: true
        default: '6.0-3'
      ffmpeg_kit_ref:
        description: 'arthenica/ffmpeg-kit ref to build from (branch, tag, or commit)'
        required: true
        default: 'development'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240

    steps:
      - name: Checkout maven repo
        uses: actions/checkout@v4
        with:
          path: maven-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build version
        run: |
          echo "BUILD_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "FFMPEG_KIT_REF=${{ github.event.inputs.ffmpeg_kit_ref }}" >> $GITHUB_ENV

      - name: Show Xcode + macOS info
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone ffmpeg-kit source
        run: |
          git clone https://github.com/arthenica/ffmpeg-kit.git ffmpeg-kit-src
          cd ffmpeg-kit-src
          git checkout "$FFMPEG_KIT_REF"
          echo "FFMPEG_KIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      - name: Install build dependencies
        run: |
          # ffmpeg-kit ios.sh requires these tools; macos-14 runner has most preinstalled
          brew update >/dev/null || true
          brew install autoconf automake libtool pkg-config nasm yasm gnu-sed || true

      - name: Build iOS xcframeworks (min variant)
        working-directory: ffmpeg-kit-src
        run: |
          chmod +x ios.sh
          # --xcframework emits xcframeworks under prebuilt/bundle-apple-xcframework-ios-<min_sdk>/
          # No --enable-* flags → min variant (same as arthenica's published ffmpeg-kit-ios-min)
          # --disable-arm64-simulator=no to ensure arm64 simulator slice (needed for Apple Silicon Macs)
          ./ios.sh --xcframework 2>&1 | tee /tmp/ios-build.log
          echo "=== build.log tail ==="
          tail -80 build.log || true

      - name: Locate xcframework bundle
        id: locate
        working-directory: ffmpeg-kit-src
        run: |
          BUNDLE_DIR=$(find prebuilt -maxdepth 1 -type d -name 'bundle-apple-xcframework-ios*' | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "ERROR: xcframework bundle directory not found under prebuilt/"
            find prebuilt -maxdepth 2 -type d | head -30
            exit 1
          fi
          echo "Bundle: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR"
          echo "bundle_dir=$BUNDLE_DIR" >> $GITHUB_OUTPUT

          # Sanity: the min variant should produce at minimum these xcframeworks
          for F in ffmpegkit libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
            if [ ! -d "$BUNDLE_DIR/${F}.xcframework" ]; then
              echo "ERROR: Missing ${F}.xcframework in bundle"
              exit 1
            fi
          done
          echo "All 8 required xcframeworks present"

      - name: Zip xcframeworks
        working-directory: ffmpeg-kit-src
        run: |
          cd "${{ steps.locate.outputs.bundle_dir }}"
          ZIP_NAME="ffmpeg-kit-min-${BUILD_VERSION}-ios-xcframework.zip"
          # Match arthenica's release zip layout: xcframeworks at zip root (no parent dir)
          zip -r -y "/tmp/${ZIP_NAME}" \
            ffmpegkit.xcframework \
            libavcodec.xcframework \
            libavdevice.xcframework \
            libavfilter.xcframework \
            libavformat.xcframework \
            libavutil.xcframework \
            libswresample.xcframework \
            libswscale.xcframework
          ls -lh "/tmp/${ZIP_NAME}"
          echo "ZIP_PATH=/tmp/${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Compute checksums
        run: |
          cd /tmp
          shasum -a 256 "$ZIP_NAME" | awk '{print $1}' > "${ZIP_NAME}.sha256"
          md5 -q "$ZIP_NAME" > "${ZIP_NAME}.md5"
          echo "SHA256: $(cat ${ZIP_NAME}.sha256)"
          echo "MD5:    $(cat ${ZIP_NAME}.md5)"

      - name: Stage artifacts + podspec into maven-repo
        run: |
          IOS_DEST="maven-repo/ios/${BUILD_VERSION}"
          mkdir -p "$IOS_DEST"
          cp "$ZIP_PATH"         "$IOS_DEST/"
          cp "${ZIP_PATH}.sha256" "$IOS_DEST/"
          cp "${ZIP_PATH}.md5"    "$IOS_DEST/"

          SHA256=$(cat "${ZIP_PATH}.sha256")
          ZIP_URL="https://homeless-pets-foundation.github.io/ffmpeg-kit-maven/ios/${BUILD_VERSION}/${ZIP_NAME}"

          # Pod version is intentionally "6.0" (not BUILD_VERSION) so this podspec
          # satisfies ffmpeg-kit-react-native's `s.dependency 'ffmpeg-kit-ios-min', "6.0"`
          # requirement unchanged. BUILD_VERSION identifies which internal build
          # produced the xcframework and shows up in the description only.
          cat > "$IOS_DEST/ffmpeg-kit-ios-min.podspec.json" <<JSON
          {
            "name": "ffmpeg-kit-ios-min",
            "version": "6.0",
            "summary": "FFmpeg Kit (min variant) iOS xcframework self-hosted mirror",
            "description": "Self-hosted mirror of arthenica/ffmpeg-kit ffmpeg-kit-ios-min@6.0 — built ${BUILD_VERSION} from ${FFMPEG_KIT_REF} (${FFMPEG_KIT_COMMIT}).",
            "homepage": "https://github.com/Homeless-Pets-Foundation/ffmpeg-kit-maven",
            "license": { "type": "LGPL-3.0" },
            "authors": "arthenica",
            "platforms": { "ios": "12.1" },
            "source": {
              "http": "${ZIP_URL}",
              "sha256": "${SHA256}"
            },
            "vendored_frameworks": [
              "ffmpegkit.xcframework",
              "libavcodec.xcframework",
              "libavdevice.xcframework",
              "libavfilter.xcframework",
              "libavformat.xcframework",
              "libavutil.xcframework",
              "libswresample.xcframework",
              "libswscale.xcframework"
            ],
            "frameworks": ["AudioToolbox", "AVFoundation", "CoreMedia", "VideoToolbox"],
            "libraries": ["c++", "bz2", "iconv", "z"]
          }
          JSON

          # Keep a stable "latest" copy for convenient referencing
          cp "$IOS_DEST/ffmpeg-kit-ios-min.podspec.json" "maven-repo/ios/ffmpeg-kit-ios-min.podspec.json"

          ls -lh "$IOS_DEST/"

      - name: Commit and push
        working-directory: maven-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ffmpeg-kit-ios-min:${BUILD_VERSION} (iOS xcframework)

          Built from arthenica/ffmpeg-kit ${FFMPEG_KIT_REF} (${FFMPEG_KIT_COMMIT}).
          Mirrors the Android 6.0-3 AAR for cross-platform feature parity after
          arthenica sunset the CocoaPods trunk binaries."
          git push
          echo "Pushed — GitHub Pages will redeploy automatically"
