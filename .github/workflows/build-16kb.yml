name: Build FFmpeg Kit min (16KB page size)

on:
  push:
    paths: ['build-trigger.txt']
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven version to publish (e.g. 6.0-3)'
        required: true
        default: '6.0-3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout maven repo
        uses: actions/checkout@v4
        with:
          path: maven-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=$(cat maven-repo/build-trigger.txt | tr -d '[:space:]')
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Clone ffmpeg-kit source (development branch — has 16KB fix)
        run: |
          git clone --depth=1 --branch development \
            https://github.com/arthenica/ffmpeg-kit.git ffmpeg-kit-src

      - name: Verify 16KB patch is present
        run: |
          grep "max-page-size=16384" ffmpeg-kit-src/scripts/function-android.sh
          grep "max-page-size=16384" ffmpeg-kit-src/android/jni/Android.mk
          echo "16KB patches confirmed present"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config cmake \
            nasm yasm texinfo curl zip unzip \
            libssl-dev zlib1g-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK command-line tools
        run: |
          # Install command-line tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extracted
          mv /tmp/cmdline-tools-extracted/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses \
            --sdk_root=$HOME/android-sdk 2>/dev/null || true

      - name: Install Android NDK r25b
        run: |
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$HOME/android-sdk \
            "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build ffmpeg-kit min variant
        working-directory: ffmpeg-kit-src
        run: |
          echo "Starting FFmpeg Kit Android min build..."
          echo "NDK: $ANDROID_NDK_ROOT"
          echo "SDK: $ANDROID_SDK_ROOT"
          chmod +x android.sh
          ./android.sh 2>&1 | tee /tmp/build.log
          echo "Build complete"

      - name: Locate and verify built AAR
        id: locate
        working-directory: ffmpeg-kit-src
        run: |
          AAR=$(find prebuilt -name "ffmpeg-kit.aar" -type f | head -1)
          if [ -z "$AAR" ]; then
            echo "ERROR: AAR not found in prebuilt/"
            find prebuilt -type f | head -20
            exit 1
          fi
          echo "Found AAR: $AAR"
          ls -lh "$AAR"
          echo "aar_path=$AAR" >> $GITHUB_OUTPUT

          # Verify 16KB alignment in arm64-v8a libraries
          unzip -q "$AAR" -d /tmp/aar_verify
          for SO in /tmp/aar_verify/jni/arm64-v8a/*.so; do
            ALIGN=$(readelf -l "$SO" 2>/dev/null | grep -oP 'Align\s+\K0x[0-9a-f]+' | head -1)
            echo "  $SO: align=$ALIGN"
          done
          echo "Expected 0x4000 (16384) for arm64-v8a libraries"

      - name: Prepare Maven artifacts
        run: |
          VERSION="$BUILD_VERSION"
          DEST="maven-repo/com/arthenica/ffmpeg-kit-min/$VERSION"
          mkdir -p "$DEST"

          SRC_AAR="ffmpeg-kit-src/${{ steps.locate.outputs.aar_path }}"
          AAR_FILE="ffmpeg-kit-min-$VERSION.aar"

          cp "$SRC_AAR" "$DEST/$AAR_FILE"
          echo "Copied AAR ($(du -h "$DEST/$AAR_FILE" | cut -f1))"

          cd "$DEST"

          # Generate checksums (content only, no filename)
          md5sum    "$AAR_FILE" | awk '{print $1}' > "$AAR_FILE.md5"
          sha1sum   "$AAR_FILE" | awk '{print $1}' > "$AAR_FILE.sha1"
          sha256sum "$AAR_FILE" | awk '{print $1}' > "$AAR_FILE.sha256"
          sha512sum "$AAR_FILE" | awk '{print $1}' > "$AAR_FILE.sha512"

          echo "Checksums:"
          cat "$AAR_FILE.md5"
          cat "$AAR_FILE.sha256"

          # Export for use in later steps
          echo "ARTIFACT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARTIFACT_DEST=$(pwd)" >> $GITHUB_ENV
          echo "ARTIFACT_SIZE=$(wc -c < "$AAR_FILE")" >> $GITHUB_ENV
          echo "ARTIFACT_SHA512=$(cat "$AAR_FILE.sha512")" >> $GITHUB_ENV
          echo "ARTIFACT_SHA256=$(cat "$AAR_FILE.sha256")" >> $GITHUB_ENV
          echo "ARTIFACT_SHA1=$(cat "$AAR_FILE.sha1")" >> $GITHUB_ENV
          echo "ARTIFACT_MD5=$(cat "$AAR_FILE.md5")" >> $GITHUB_ENV

      - name: Create POM file
        run: |
          VERSION="$ARTIFACT_VERSION"
          cat > "$ARTIFACT_DEST/ffmpeg-kit-min-$VERSION.pom" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <!-- do_not_remove: published-with-gradle-metadata -->
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.arthenica</groupId>
            <artifactId>ffmpeg-kit-min</artifactId>
            <version>$VERSION</version>
            <packaging>aar</packaging>
            <name>ffmpeg-kit-min</name>
            <description>Includes FFmpeg without any external libraries enabled. Built with 16KB page size alignment (-Wl,-z,max-page-size=16384) on Android NDK r25b.</description>
            <url>https://github.com/arthenica/ffmpeg-kit</url>
            <licenses>
              <license>
                <name>GNU Lesser General Public License, Version 3</name>
                <url>https://www.gnu.org/licenses/lgpl-3.0.txt</url>
              </license>
            </licenses>
            <developers>
              <developer>
                <id>arthenica</id>
                <name>ARTHENICA</name>
                <email>open-source@arthenica.com</email>
              </developer>
            </developers>
            <scm>
              <connection>https://github.com/arthenica/ffmpeg-kit.git</connection>
              <developerConnection>https://github.com/arthenica/ffmpeg-kit.git</developerConnection>
              <url>https://github.com/arthenica/ffmpeg-kit</url>
            </scm>
            <dependencies>
              <dependency>
                <groupId>com.arthenica</groupId>
                <artifactId>smart-exception-java</artifactId>
                <version>0.2.1</version>
                <scope>compile</scope>
              </dependency>
            </dependencies>
          </project>
          EOF

          # POM checksums
          cd "$ARTIFACT_DEST"
          POM="ffmpeg-kit-min-$VERSION.pom"
          md5sum    "$POM" | awk '{print $1}' > "$POM.md5"
          sha1sum   "$POM" | awk '{print $1}' > "$POM.sha1"
          sha256sum "$POM" | awk '{print $1}' > "$POM.sha256"
          sha512sum "$POM" | awk '{print $1}' > "$POM.sha512"

      - name: Create Gradle Module Metadata (.module) file
        run: |
          VERSION="$ARTIFACT_VERSION"
          python3 - <<PYEOF
          import json, os

          version    = os.environ["ARTIFACT_VERSION"]
          size       = int(os.environ["ARTIFACT_SIZE"])
          sha512     = os.environ["ARTIFACT_SHA512"]
          sha256     = os.environ["ARTIFACT_SHA256"]
          sha1       = os.environ["ARTIFACT_SHA1"]
          md5        = os.environ["ARTIFACT_MD5"]
          dest       = os.environ["ARTIFACT_DEST"]

          aar_name = f"ffmpeg-kit-min-{version}.aar"

          dep = {
              "group": "com.arthenica",
              "module": "smart-exception-java",
              "version": {"requires": "0.2.1"}
          }
          file_entry = {
              "name": aar_name,
              "url": aar_name,
              "size": size,
              "sha512": sha512,
              "sha256": sha256,
              "sha1": sha1,
              "md5": md5,
          }

          module = {
              "formatVersion": "1.1",
              "component": {
                  "group": "com.arthenica",
                  "module": "ffmpeg-kit-min",
                  "version": version,
                  "attributes": {"org.gradle.status": "release"}
              },
              "createdBy": {"gradle": {"version": "8.3"}},
              "variants": [
                  {
                      "name": "releaseVariantReleaseApiPublication",
                      "attributes": {
                          "org.gradle.category": "library",
                          "org.gradle.dependency.bundling": "external",
                          "org.gradle.libraryelements": "aar",
                          "org.gradle.usage": "java-api"
                      },
                      "dependencies": [dep],
                      "files": [file_entry]
                  },
                  {
                      "name": "releaseVariantReleaseRuntimePublication",
                      "attributes": {
                          "org.gradle.category": "library",
                          "org.gradle.dependency.bundling": "external",
                          "org.gradle.libraryelements": "aar",
                          "org.gradle.usage": "java-runtime"
                      },
                      "dependencies": [dep],
                      "files": [file_entry]
                  }
              ]
          }

          out_path = os.path.join(dest, f"ffmpeg-kit-min-{version}.module")
          with open(out_path, "w") as f:
              json.dump(module, f, indent=2)
          print(f"Wrote {out_path}")
          PYEOF

          # Module checksums
          cd "$ARTIFACT_DEST"
          MOD="ffmpeg-kit-min-$VERSION.module"
          md5sum    "$MOD" | awk '{print $1}' > "$MOD.md5"
          sha1sum   "$MOD" | awk '{print $1}' > "$MOD.sha1"
          sha256sum "$MOD" | awk '{print $1}' > "$MOD.sha256"
          sha512sum "$MOD" | awk '{print $1}' > "$MOD.sha512"

      - name: List generated artifacts
        run: ls -lh "$ARTIFACT_DEST/"

      - name: Commit and push new version to maven repo
        working-directory: maven-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add com.arthenica:ffmpeg-kit-min:$BUILD_VERSION (16KB page size support)

          Built from arthenica/ffmpeg-kit development branch (commit 913e5b7).
          - arm64-v8a and x86_64: -Wl,-z,max-page-size=16384 (16KB ELF load segment alignment)
          - NDK r25b (25.2.9519653)
          - Fixes Google Play 16KB page size policy requirement"
          git push
          echo "Pushed to main — GitHub Pages will redeploy automatically"
